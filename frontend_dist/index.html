<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-C_cJVYtI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CJ9SQyCK.css">
  </head>
  <body>
    <div id="root">
      <div id="skinner-pre-mount" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#121212;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;">
        <div style="margin-bottom:16px;">
          <img src="./logo.png" alt="Skinner" style="width:72px;height:72px;object-fit:contain;" />
        </div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px;">Starting Skinner...</div>
        <div id="skinner-startup-status" style="font-size:12px;color:#9ca3af;">Initializing application engine...</div>
        <div id="skinner-startup-error" style="display:none;margin-top:20px;max-width:480px;padding:16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;text-align:center;">
          <div style="color:#ef4444;font-weight:600;margin-bottom:6px;">Startup Notice</div>
          <div id="skinner-startup-err-msg" style="font-size:12px;color:#d1d5db;margin-bottom:12px;"></div>
          <button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;">Retry</button>
        </div>
      </div>
    </div>
    <script>
      window.__reactMounted = false;
      window.addEventListener('error', function(e) {
        if (!window.__reactMounted) {
          var errBox = document.getElementById('skinner-startup-error');
          var errMsg = document.getElementById('skinner-startup-err-msg');
          if (errBox && errMsg) {
            errMsg.innerText = "JavaScript Error: " + (e.message || "Unknown error occurred during frontend initialization.");
            errBox.style.display = 'block';
          }
        }
      });
      setTimeout(function() {
        if (!window.__reactMounted) {
          var errBox = document.getElementById('skinner-startup-error');
          var errMsg = document.getElementById('skinner-startup-err-msg');
          if (errBox && errMsg) {
            errMsg.innerText = "The application interface took longer than expected to load. Check logs at %APPDATA%\\Skinner\\Logs\\startup.log or click Retry.";
            errBox.style.display = 'block';
          }
        }
      }, 10000);
    </script>
  </body>
</html>
