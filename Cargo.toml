[package]
name = "brawlcraft-slint"
version = "3.3.4"
edition = "2021"

[[bin]]
name = "Skinner"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
sha2 = "0.10"
quick-xml = "0.37"
winreg = "0.52"
chrono = "0.4"
open = "5.3"
wry = "0.57.1"
tao = "0.37.2"
rust-embed = "8.13.0"
mime_guess = "2.0.5"
percent-encoding = "2.3"
image = "0.25.10"
ed25519-dalek = { version = "3.0.0", features = ["default"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
